apiVersion: v1
kind: Secret
metadata:
  name: f1-timing-creds
  namespace: f1-timing
type: Opaque
stringData:
  # Secret key used by FastAPI for session encoding (Generate via: openssl rand -hex 32)
  F1TV_SECRET_KEY: "CHANGE_THIS_TO_A_RANDOM_32_BYTE_HEX_STRING"
  # Optional F1TV account credentials for backend authentication
  F1_USERNAME: "your-email@example.com"
  F1_PASSWORD: "your-password-here"
